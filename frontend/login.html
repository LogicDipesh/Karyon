<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karyon — Admin Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #2c3e50;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .login-box {
            background-color: white;
            padding: 2rem 3rem;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            text-align: center;
            width: 320px;
        }
        .login-box h1 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 24px;
        }
        .login-box p {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #34495e;
            font-weight: 500;
            font-size: 13px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .input-group input:focus {
            border-color: #3498db;
            outline: none;
        }
        .login-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .login-btn:hover {
            background-color: #2980b9;
        }
        #error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 12px;
            min-height: 15px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Karyon Admin</h1>
        <p>Disaster Response Coordinator</p>
        
        <form id="login-form">
            <div class="input-group">
                <label for="user_id">User ID</label>
                <input type="text" id="user_id" required placeholder="Enter Admin ID" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter Password">
            </div>
            <button type="submit" class="login-btn">Secure Login</button>
            <div id="error-msg"></div>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = document.getElementById('user_id').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            
            errorMsg.textContent = "Authenticating...";
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, password: password })
                });
                
                if (res.ok) {
                    errorMsg.style.color = '#2ecc71';
                    errorMsg.textContent = "Success! Redirecting...";
                    setTimeout(() => {
                        window.location.href = "/";
                    }, 500);
                } else {
                    const data = await res.json();
                    errorMsg.style.color = '#e74c3c';
                    errorMsg.textContent = data.error || "Invalid credentials.";
                }
            } catch (err) {
                errorMsg.style.color = '#e74c3c';
                errorMsg.textContent = "Network error connecting to server.";
            }
        });
    </script>
</body>
</html>
